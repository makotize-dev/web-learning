<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習スケジュール（目次）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --border: #2a3045;
    --text: #e2e8f0;
    --muted: #6b7a99;
    --accent: #22d3ee;
    --green: #22c55e;
    --phase1: #eab308;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  header { max-width: 720px; margin: 0 auto 28px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  header p { font-size: 13px; color: var(--muted); }

  .list {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .item {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
  }
  .item:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .item.current { border-color: var(--phase1); }
  .item.current:hover { border-color: var(--accent); }

  .item .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .item h2 {
    font-size: 15px;
    font-weight: 600;
  }
  .item .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .item .badge.done {
    color: var(--green);
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.4);
  }
  .item .badge.now {
    color: var(--phase1);
    background: rgba(234,179,8,.12);
    border: 1px solid rgba(234,179,8,.4);
  }
  .item p {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .item .dates {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .footer {
    max-width: 720px;
    margin: 28px auto 0;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>Web学習 スケジュール</h1>
  <p>期間ごとのガントチャート一覧。現行のものをここから開いてください。</p>
</header>

<div class="list">

  <a href="schedule_202606.html" class="item current">
    <div class="row">
      <h2>2026年6月〜8月</h2>
      <span class="badge now">現行</span>
    </div>
    <p>入口クリア後の本ゴールへ。Phase 1（景色を見る／フレームワーク覗き）→ 移動期間 → Phase 2（プロジェクト開始）。</p>
    <div class="dates">6/1 〜 8/31</div>
  </a>

  <a href="schedule_202604.html" class="item">
    <div class="row">
      <h2>2026年4月〜5月</h2>
      <span class="badge done">✓ 完結</span>
    </div>
    <p>HTML → CSS → JS の段階的学習ロードマップ。Level A〜C 達成・5/31「JS×AI」ゴール達成。</p>
    <div class="dates">4/1 〜 5/31</div>
  </a>

</div>

<div class="footer">
  <a href="profile.html">← プロフィール</a>
</div>

</body>
</html>
